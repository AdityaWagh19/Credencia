name: Frontend CI/CD — Vercel

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  # ── Type Check + Lint ────────────────────────────────────────────────────────
  validate:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          # VITE_ variables are inlined into the client bundle at build time.
          # App IDs are not sensitive — they are public Algorand contract addresses.
          VITE_NETWORK: testnet
          VITE_ALGOD_SERVER: https://testnet-api.algonode.cloud
          VITE_KYC_REGISTRY_APP_ID: "759379619"
          VITE_CREDIT_SCORE_APP_ID: "759379629"
          VITE_LENDING_POOL_APP_ID: "759454547"
          VITE_LOAN_MANAGER_APP_ID: "759454548"
          VITE_REPAYMENT_ESCROW_APP_ID: "759379632"
          # VITE_API_URL — set this in the Vercel project dashboard,
          # not here, so it can differ between preview and production.
        run: npm run build

  # ── Deployment ────────────────────────────────────────────────────────────────
  # Deployment is handled by Vercel's native GitHub App integration.
  # No tokens or GitHub secrets are needed.
  #
  # Setup (one-time):
  #   1. Go to vercel.com → Add New Project → Import AdityaWagh19/Credencia
  #   2. Set Root Directory to: frontend
  #   3. Set Framework Preset to: Vite
  #   4. Add VITE_API_URL env var pointing to your Railway API URL
  #   5. Deploy — Vercel auto-deploys on every push to main going forward
