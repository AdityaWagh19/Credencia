name: Frontend CI/CD — Vercel

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  # ── Type Check + Lint ────────────────────────────────────────────────────────
  validate:
    name: Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Vite Build
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_NETWORK: testnet
          VITE_ALGOD_SERVER: https://testnet-api.algonode.cloud
          VITE_KYC_REGISTRY_APP_ID: ${{ secrets.VITE_KYC_REGISTRY_APP_ID }}
          VITE_CREDIT_SCORE_APP_ID: ${{ secrets.VITE_CREDIT_SCORE_APP_ID }}
          VITE_LENDING_POOL_APP_ID: ${{ secrets.VITE_LENDING_POOL_APP_ID }}
          VITE_LOAN_MANAGER_APP_ID: ${{ secrets.VITE_LOAN_MANAGER_APP_ID }}
          VITE_REPAYMENT_ESCROW_APP_ID: ${{ secrets.VITE_REPAYMENT_ESCROW_APP_ID }}
          VITE_WC_PROJECT_ID: ${{ secrets.VITE_WC_PROJECT_ID }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── Deploy to Vercel (main branch only) ──────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"
