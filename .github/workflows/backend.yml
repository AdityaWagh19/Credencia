name: Backend CI/CD — Railway

on:
  push:
    branches:
      - main
    paths:
      - "backend/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  # ── Lint + Audit ──────────────────────────────────────────────────────────────
  validate:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  # ── Integration / Smoke Test ──────────────────────────────────────────────────
  # Spins up Redis in a service container and runs the health-check suite.
  # Full E2E (on-chain) tests are intentionally excluded from CI as they require
  # funded testnet wallets and live Algorand RPC.
  smoke-test:
    name: Smoke Test (API health)
    runs-on: ubuntu-latest
    needs: validate

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start API server in background
        env:
          NODE_ENV: test
          PORT: 3001
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-test-secret-do-not-use-in-production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALGORAND_NETWORK: testnet
          ALGOD_SERVER: https://testnet-api.algonode.cloud
          ALGOD_TOKEN: ""
          ALGOD_PORT: "443"
          ORACLE_MNEMONIC: ${{ secrets.ORACLE_MNEMONIC }}
          KYC_REGISTRY_APP_ID: ${{ secrets.KYC_REGISTRY_APP_ID }}
          CREDIT_SCORE_APP_ID: ${{ secrets.CREDIT_SCORE_APP_ID }}
          LENDING_POOL_APP_ID: ${{ secrets.LENDING_POOL_APP_ID }}
          LOAN_MANAGER_APP_ID: ${{ secrets.LOAN_MANAGER_APP_ID }}
          REPAYMENT_ESCROW_APP_ID: ${{ secrets.REPAYMENT_ESCROW_APP_ID }}
          PLATFORM_WALLET: ${{ secrets.PLATFORM_WALLET }}
          ADMIN_ADDRESSES: ${{ secrets.ADMIN_ADDRESSES }}
          FRONTEND_URLS: http://localhost:8080
          MOCK_KYC: "false"
        run: |
          node api/src/server.js &
          echo "API_PID=$!" >> $GITHUB_ENV

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3001/api/health && echo "API ready" && exit 0
            echo "Attempt $i — waiting..."
            sleep 2
          done
          echo "API did not start in time" && exit 1

      - name: Health check
        run: |
          RESPONSE=$(curl -sf http://localhost:3001/api/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep '"status":"ok"'
          echo "$RESPONSE" | grep '"network":"testnet"'

      - name: Pool stats endpoint (public, no auth)
        run: |
          curl -sf http://localhost:3001/api/pool/stats | grep "totalLiquidity"

      - name: Nonce endpoint (auth flow start)
        run: |
          curl -sf -X POST http://localhost:3001/api/auth/nonce \
            -H "Content-Type: application/json" \
            -d '{"address":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}' \
            || true

      - name: Stop API server
        if: always()
        run: kill $API_PID 2>/dev/null || true

  # ── Docker Build Validation ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: backend/backend
          file: backend/backend/Dockerfile
          push: false
          tags: credencia-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Railway (main branch only) ─────────────────────────────────────
  # Railway watches the GitHub repo directly and redeploys on push to main.
  # This job notifies Railway to trigger a deploy for each service via the API.
  deploy:
    name: Trigger Railway Deploy
    runs-on: ubuntu-latest
    needs: [smoke-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Railway deploy — API service
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { deploymentCreate(input: { serviceId: \"${{ secrets.RAILWAY_API_SERVICE_ID }}\", environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\" }) { id status } }"}' \
            https://backboard.railway.app/graphql/v2 || echo "Railway API deploy triggered (or already auto-deploying)"

      - name: Trigger Railway deploy — Oracle service
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { deploymentCreate(input: { serviceId: \"${{ secrets.RAILWAY_ORACLE_SERVICE_ID }}\", environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\" }) { id status } }"}' \
            https://backboard.railway.app/graphql/v2 || echo "Railway Oracle deploy triggered"

      - name: Trigger Railway deploy — Jobs service
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { deploymentCreate(input: { serviceId: \"${{ secrets.RAILWAY_JOBS_SERVICE_ID }}\", environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\" }) { id status } }"}' \
            https://backboard.railway.app/graphql/v2 || echo "Railway Jobs deploy triggered"
