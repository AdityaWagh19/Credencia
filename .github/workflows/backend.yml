name: Backend CI/CD — Railway

on:
  push:
    branches:
      - main
    paths:
      - "backend/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  # ── Lint + Audit ──────────────────────────────────────────────────────────────
  validate:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  # ── Smoke Test (API health) ───────────────────────────────────────────────────
  # Spins up Redis in a service container and verifies the API boots and responds.
  # Full E2E (on-chain) tests require funded testnet wallets so are excluded from CI.
  smoke-test:
    name: Smoke Test (API health)
    runs-on: ubuntu-latest
    needs: validate

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start API server in background
        env:
          NODE_ENV: test
          PORT: 3001
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-test-secret-not-used-in-production
          # Supabase and Algorand calls are stubbed in test mode.
          # The health endpoint and pool/stats respond without them.
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_KEY: placeholder
          ALGORAND_NETWORK: testnet
          ALGOD_SERVER: https://testnet-api.algonode.cloud
          ALGOD_TOKEN: ""
          ALGOD_PORT: "443"
          ORACLE_MNEMONIC: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon invest"
          KYC_REGISTRY_APP_ID: "759379619"
          CREDIT_SCORE_APP_ID: "759379629"
          LENDING_POOL_APP_ID: "759454547"
          LOAN_MANAGER_APP_ID: "759454548"
          REPAYMENT_ESCROW_APP_ID: "759379632"
          PLATFORM_WALLET: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          ADMIN_ADDRESSES: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          FRONTEND_URLS: http://localhost:8080
          MOCK_KYC: "false"
        run: |
          node api/src/server.js &
          echo "API_PID=$!" >> $GITHUB_ENV

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3001/api/health && echo "API ready" && exit 0
            echo "Attempt $i — waiting..."
            sleep 2
          done
          echo "API did not start in time" && exit 1

      - name: Health check
        run: |
          curl -sf http://localhost:3001/api/health | grep '"status"'

      - name: Stop API server
        if: always()
        run: kill $API_PID 2>/dev/null || true

  # ── Docker Build Validation ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: backend/backend
          file: backend/backend/Dockerfile
          push: false
          tags: credencia-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deployment ────────────────────────────────────────────────────────────────
  # Deployment is handled by Railway's native GitHub integration.
  # No RAILWAY_TOKEN or GitHub secrets are needed.
  #
  # Setup (one-time, per service):
  #   1. Go to railway.app → New Project → Deploy from GitHub → AdityaWagh19/Credencia
  #   2. Add a Redis database add-on
  #   3. Create 3 services from the same repo, each with root: backend/backend
  #      - credencia-api    → start: node api/src/server.js        port: 3001
  #      - credencia-oracle → start: node oracle-worker/src/oracle.js
  #      - credencia-jobs   → start: node job-worker/src/jobs.js
  #   4. Set environment variables on each service (from your .env)
  #   5. Railway auto-deploys all 3 services on every push to main going forward
